set -g mouse on
set -g history-limit 1000000     # increase history size (from 2,000)
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g extended-keys on          # enable extended keys (for pi)
set -g extended-keys-format csi-u # use CSI u format for extended keys (for pi)
set -g detach-on-destroy off     # Stay in tmux when session closes
set -s escape-time 0             # No delay after Esc

set-option -sa terminal-overrides ",xterm*:Tc" # Set true color

# set vi mode
set-window-option -g mode-keys vi

# Named panes
set -g pane-border-status top
set -g pane-border-format '#[bold]#{pane_index}: #{pane_current_command}'

#settings to allow Yazi image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Set prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'alexwforsythe/tmux-which-key'
# These two should be loaded last
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# tmux/yank config 
set -g @yank_action 'copy-pipe'

bind b switch-client -T pane_table
bind -r -T pane_table Left resize-pane -L 5
bind -r -T pane_table Right resize-pane -R 5
bind -r -T pane_table Up resize-pane -U 5
bind -r -T pane_table Down resize-pane -D 5
bind -r -T pane_table h resize-pane -L 5
bind -r -T pane_table l resize-pane -R 5

# reload config file (change file location to your the tmux.conf you want to use)
bind R source-file ~/.config/tmux/tmux.conf

# Prefix Shift-K to clear scrollback history
bind K send-keys -R C-l \; clear-history

# Index windows and panes from 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Open panes in current directory
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Rearrange windows with Ctrl + Shift Left/Right
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

bind -T split_table h split-window -v -c "#{pane_current_path}"
bind -T split_table - split-window -v -c "#{pane_current_path}"
bind -T split_table v split-window -h -c "#{pane_current_path}"
bind -T split_table | split-window -h -c "#{pane_current_path}"

# Session switcher
bind C-s display-popup -h 15 -w 30 -E "tmux-session-switcher"

set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato, mocha
set -g @continuum-boot 'off'
set -g @continuum-boot-options 'ghostty'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Catppuccin styling
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
# set -g @catppuccin_window_left_separator ""
# set -g @catppuccin_window_right_separator " "
# set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_text " #W#{?@workmux_status, #{@workmux_status},}"
set -g @catppuccin_window_number_color "#{@thm_blue}"
set -g @catppuccin_window_current_text " #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"

set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_peach},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_peach}}}"

set -g status-right-length 100
set -g status-left-length 100
set -g @catppuccin_status_modules_right "directory gitmux"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# https://tmuxpack.github.io/
run '~/.tmux/plugins/tpm/tpm'
